openapi: 3.1.0
info:
  title: Ingestor API
  version: 1.0.0
paths:
  /projects:
    get:
      summary: List projects (paged)
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          $ref: '#/components/responses/PagedProjectsResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
      responses:
        "201":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{token}:
    get:
      summary: Get a project by share token
      operationId: getRequest
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/admin/{token}:
    put:
      summary: Fully update a project
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Partially update a project
      operationId: patchProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        "204":
          description: "The project was deleted"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ShareToken:
      name: token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Token'
    AdminToken:
      name: token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Token'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ProjectResponse:
      description: "A single project"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    PagedProjectsResponse:
      description: "A page of projects"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedProjects'
    NotFound:
      description: "The requested project was not found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: "The request was malformed or invalid"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: "An internal server error occurred"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Project:
      type: object
      required: [id, share_token, description, updated_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
        share_token:
          $ref: '#/components/schemas/Token'
        admin_token:
          $ref: '#/components/schemas/Token'
        description:
          type: string
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ProjectId:
      type: string
      format: uuid
      pattern: "[a-fA-F0-9]{8}-[a-fA-F0-9]{4}-4[a-fA-F0-9]{3}-[89abAB][a-fA-F0-9]{3}-[a-fA-F0-9]{12}"
    Token:
      type: string
      pattern: "[abcdefgijkmnopqrstwxyzABCDEFGHJKLMNPQRSTWXYZ23456789]{16}"
    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: integer
        traceback:
          type: string
        details:
          type: object
          additionalProperties: true
    NewProject:
      type: object
      required: [description]
      properties:
        description:
          type: string
    ProjectPatch:
      type: object
      properties:
        description:
          type: string
    PagedProjects:
      type: object
      required: [projects, page, per_page, total]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
