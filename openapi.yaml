openapi: 3.1.0
info:
  title: Ingestor API
  version: 1.0.0
paths:
  /ping:
    get:
      summary: Health check
      operationId: getPing
      responses:
        "200":
          $ref: '#/components/responses/PingResponse'
  /projects:
    get:
      summary: List projects (paged)
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        "200":
          $ref: '#/components/responses/PagedProjectsResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a new project
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
      responses:
        "201":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{share-token}:
    get:
      summary: Get a project by share token
      operationId: getProjectByShareToken
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{share-token}/users:
    get:
      summary: List a project's users (paged)
      operationId: listProjectUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ShareToken'
      responses:
        "200":
          $ref: '#/components/responses/PagedUsersResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a new project user
      operationId: createProjectUser
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        "201":
          $ref: '#/components/responses/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{share-token}/users/{user-id}:
    get:
      summary: Get a project's user by id
      operationId: getProjectUser
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          $ref: '#/components/responses/UserResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update a user
      operationId: patchProjectUser
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          $ref: '#/components/responses/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{share-token}/media:
    post:
      summary: Upload media to a project
      operationId: uploadProjectMedia
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          $ref: '#/components/responses/MediaResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{share-token}/media/download:
    get:
      summary: Download a project's media
      operationId: downloadProjectMediaArchive
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/FilenameFormat'
      responses:
        "200":
          $ref: '#/components/responses/ProjectMediaArchiveDownloadResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{share-token}/media/{media-id}:
    get:
      summary: Get media metadata
      operationId: getProjectMedia
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
      responses:
        "200":
          $ref: '#/components/responses/MediaResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update media metadata
      operationId: updateProjectMedia
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUpdate'
      responses:
        "200":
          $ref: '#/components/responses/MediaResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/{share-token}/media/{media-id}/download:
    get:
      summary: Download a media file
      operationId: downloadProjectMediaFile
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/FilenameFormat'
      responses:
        "200":
          $ref: '#/components/responses/ProjectMediaDownloadResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/admin/{admin-token}:
    put:
      summary: Fully update a project
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Partially update a project
      operationId: patchProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        "204":
          description: "The project was deleted"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /projects/admin/{admin-token}/media/{media-id}:
    delete:
      summary: Delete media from a project
      operationId: deleteProjectMedia
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - $ref: '#/components/parameters/MediaId'
      responses:
        "204":
          description: "The media was deleted"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ShareToken:
      name: share-token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Token'
    AdminToken:
      name: admin-token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Token'
    MediaId:
      name: media-id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MediaId'
    UserId:
      name: user-id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 2
    FilenameFormat:
      name: filename_format
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FilenameFormat'
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
  responses:
    PingResponse:
      description: "The server is alive"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pong'
    ProjectMediaArchiveDownloadResponse:
      description: "All media in a project, archived as a zip or tar file. If mime type is application/octet-stream, the zip file is served."
      content:
        application/octet-stream:
          schema:
            $ref: '#/components/schemas/DownloadFile'
        application/x-tar:
          schema:
            $ref: '#/components/schemas/DownloadFile'
        application/gzip:
          schema:
            $ref: '#/components/schemas/DownloadFile'
        application/zip:
          schema:
            $ref: '#/components/schemas/DownloadFile'
    ProjectMediaDownloadResponse:
      description: "A single media file"
      content:
        application/octet-stream:
          schema:
            $ref: '#/components/schemas/DownloadFile'
    ProjectResponse:
      description: "A single project"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    UserResponse:
      description: "A single user"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    PagedProjectsResponse:
      description: "A page of projects"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedProjects'
    PagedUsersResponse:
      description: "A page of users for a project"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedUsers'
    MediaResponse:
      description: "Media metadata"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Media'
    NotFound:
      description: "The requested project was not found"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: "The request was malformed or invalid"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: "An internal server error occurred"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Pong:
      type: object
      required: [message]
      properties:
        message:
          type: string
          enum: ["pong"]
    Project:
      type: object
      required: [id, share_token, description, filename_format, updated_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
        share_token:
          $ref: '#/components/schemas/Token'
        admin_token:
          $ref: '#/components/schemas/Token'
        description:
          $ref: '#/components/schemas/ProjectDescription'
        filename_format:
          $ref: '#/components/schemas/FilenameFormat'
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, name, updated_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        name:
          $ref: '#/components/schemas/Username'
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ProjectId:
      type: string
      format: uuid
    MediaId:
      type: string
      format: uuid
    UserId:
      type: string
      format: uuid
    Token:
      type: string
      pattern: "^[abcdefgijkmnopqrstwxyzABCDEFGHJKLMNPQRSTWXYZ23456789]{16}$"
    RequestId:
      type: string
      format: uuid
    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: integer
        traceback:
          type: string
        details:
          type: object
          additionalProperties: true
    ProblemDetails:
      # https://www.rfc-editor.org/info/rfc9457/
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
          description: A URI reference that identifies the problem type. When omitted, it is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem.
      additionalProperties: true
    Page:
      type: object
      required: [page_num, per_page, total]
      properties:
        page_num:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    NewProject:
      type: object
      required: [description]
      properties:
        description:
          $ref: '#/components/schemas/ProjectDescription'
        filename_format:
          $ref: '#/components/schemas/FilenameFormat'
    ProjectPatch:
      type: object
      properties:
        description:
          $ref: '#/components/schemas/ProjectDescription'
        filename_format:
          $ref: '#/components/schemas/FilenameFormat'
    PagedProjects:
      type: object
      required: [projects, page]
      properties:
        page:
          $ref: '#/components/schemas/Page'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PagedUsers:
      type: object
      required: [users, page]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/Page'
    NewUser:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Username'
    Image:
      type: object
      required: [id, type, original_filename, generated_filename, width, height, image_codec]
      properties:
        id:
          $ref: '#/components/schemas/MediaId'
        type:
          type: string
          enum: [image]
        original_filename:
          type: string
        generated_filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        image_codec:
          type: string
        time_correction_offset:
          type: string
          format: duration
    Video:
      type: object
      required: [id, type, original_filename, generated_filename, width, height, length, video_codec]
      properties:
        id:
          $ref: '#/components/schemas/MediaId'
        type:
          type: string
          enum: [video]
        original_filename:
          type: string
        generated_filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        length:
          type: string
          format: duration
        video_codec:
          type: string
        time_correction_offset:
          type: string
          format: duration
    Media:
      oneOf:
        - $ref: '#/components/schemas/Image'
        - $ref: '#/components/schemas/Video'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/Image'
          video: '#/components/schemas/Video'
    MediaUpdate:
      type: object
      properties:
        original_filename:
          type: string
        time_correction_offset:
          type: string
          format: duration
    UserUpdate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Username'
    FilenameFormat:
      type: string
      description: "A time format that follows the go Time.Format specification. See https://pkg.go.dev/time#Layout"
    ProjectDescription:
      type: string
      maxLength: 64
    Username:
      type: string
      description: "A user's name"
      pattern: "^[a-zA-Z0-9]{32}$"
    DownloadFile:
      type: string
      format: binary
