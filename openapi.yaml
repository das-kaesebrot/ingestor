openapi: 3.1.0
info:
  title: Ingestor API
  version: 1.0.0
tags:
  - name: system
    description: General system operations.
  - name: projects
    description: Project operations for share token clients.
  - name: users
    description: Project user operations for share token clients.
  - name: media
    description: Project media operations for share token clients.
  - name: download
    description: Project download media operations for share token clients.
  - name: jobs
    description: Project job operations for share token clients.
  - name: admin-projects
    description: Project operations for admin clients.
  - name: admin-users
    description: Project user operations for admin clients.
  - name: admin-media
    description: Project media operations for admin clients.
  - name: admin-jobs
    description: Project job operations for admin clients.
paths:
  /ping:
    get:
      summary: Health check
      operationId: getPing
      responses:
        "200":
          $ref: '#/components/responses/PingResponse'
      tags:
        - system
  /capabilities:
    get:
      summary: Get all system capabilities
      operationId: getSystemCapabilities
      responses:
        "200":
          $ref: '#/components/responses/SystemCapabilitiesResponse'
      tags:
        - system
  /projects:
    get:
      summary: List projects (paged)
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          $ref: '#/components/responses/PagedProjectsResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - projects
    post:
      summary: Create a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
      responses:
        "201":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - projects
  /projects/{share-token}:
    get:
      summary: Get a project by share token
      operationId: getProjectByShareToken
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - projects
  /projects/{share-token}/users:
    get:
      summary: List a project's users (paged)
      operationId: listProjectUsers
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ShareToken'
      responses:
        "200":
          $ref: '#/components/responses/PagedUsersResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - users
    post:
      summary: Create a new project user
      operationId: createProjectUser
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        "201":
          $ref: '#/components/responses/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - users
  /projects/{share-token}/users/{user-id}:
    get:
      summary: Get a project's user by id
      operationId: getProjectUser
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          $ref: '#/components/responses/UserResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - users
    patch:
      summary: Update a user
      operationId: patchProjectUser
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        "200":
          $ref: '#/components/responses/UserResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - users
  /projects/{share-token}/jobs:
    get:
      summary: Get a project's background jobs
      operationId: getProjectBackgroundJobs
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/FilterJobType'
        - $ref: '#/components/parameters/FilterJobStatus'
      responses:
        "200":
          $ref: '#/components/responses/PagedJobsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - jobs
  /projects/{share-token}/media:
    get:
      summary: List a project's media (paged)
      operationId: listProjectMediaMetadata
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ShareToken'
      responses:
        "200":
          $ref: '#/components/responses/PagedMediaMetadataResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - media
  /projects/{share-token}/media/upload:
    post:
      summary: Upload media to a project
      operationId: uploadProjectMedia
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          $ref: '#/components/responses/MediaMetadataResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/UploadNotAllowed'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - media
  /projects/{share-token}/media/download:
    get:
      summary: Download a project's media
      operationId: downloadProjectMediaArchive
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/FilenameFormat'
      responses:
        "200":
          $ref: '#/components/responses/ProjectMediaArchiveDownloadResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/DownloadNotAllowed'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - download
  /projects/{share-token}/media/download/filtered:
    post:
      summary: Create a custom filtered download archive
      operationId: createDownloadProjectFilteredMediaArchive
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFilteredDownload'
      responses:
        "200":
          $ref: '#/components/responses/FilteredDownloadResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/DownloadNotAllowed'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - download
  /projects/{share-token}/media/download/filtered/{download-token}:
    get:
      summary: Download a custom filtered download archive
      operationId: downloadProjectFilteredMediaArchive
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/FilteredDownloadToken'
        - $ref: '#/components/parameters/FilenameFormat'
      responses:
        "200":
          $ref: '#/components/responses/ProjectMediaArchiveDownloadResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/DownloadNotAllowed'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - download
  /projects/{share-token}/media/{media-id}:
    get:
      summary: Get media metadata
      operationId: getProjectMedia
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
      responses:
        "200":
          $ref: '#/components/responses/MediaMetadataResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - media
    patch:
      summary: Update media metadata
      operationId: updateProjectMedia
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaMetadataUpdate'
      responses:
        "200":
          $ref: '#/components/responses/MediaMetadataResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - media
  /projects/{share-token}/media/{media-id}/sync:
    post:
      summary: Synchronise the capture time of one or more media files to the media file in the path.
      operationId: syncProjectMediaFile
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaMetadataTimesync'
      responses:
        "204":
          description: "The operation was performed successfully."
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - media
  /projects/{share-token}/media/{media-id}/download:
    get:
      summary: Download a single media file
      operationId: downloadProjectMediaFile
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/FilenameFormat'
      responses:
        "200":
          $ref: '#/components/responses/ProjectMediaDownloadResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/DownloadNotAllowed'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - download
  /projects/{share-token}/media/{media-id}/thumb:
    get:
      summary: Download a media thumbnail
      operationId: downloadProjectMediaThumbnail
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/ThumbnailWidth'
        - $ref: '#/components/parameters/ThumbnailHeight'
        - $ref: '#/components/parameters/ThumbnailCropMode'
      responses:
        "200":
          $ref: '#/components/responses/ThumbnailResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - download
  /admin/projects/{admin-token}:
    patch:
      summary: Partially update a project
      operationId: patchProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        "200":
          $ref: '#/components/responses/ProjectResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - admin-projects
    delete:
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        "204":
          description: "The project was deleted"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - admin-projects
  /admin/projects/{admin-token}/users/{user-id}:
    delete:
      summary: Delete a user from a project
      operationId: deleteProjectUser
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - $ref: '#/components/parameters/UserId'
      responses:
        "204":
          description: "The user was deleted"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - admin-users
  /admin/projects/{admin-token}/media/delete:
    post:
      summary: Delete media from a project (batched)
      operationId: deleteProjectMediaBatched
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaBatchDeletionRequest'
      responses:
        "204":
          description: "The media files were deleted"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - admin-media
  /admin/projects/{admin-token}/media/{media-id}:
    delete:
      summary: Delete media from a project
      operationId: deleteProjectMedia
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - $ref: '#/components/parameters/MediaId'
      responses:
        "204":
          description: "The media was deleted"
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      tags:
        - admin-media
components:
  parameters:
    ShareToken:
      name: share-token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Token'
    AdminToken:
      name: admin-token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Token'
    MediaId:
      name: media-id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MediaId'
    ThumbnailWidth:
      name: w
      in: query
      required: false
      schema:
        type: integer
        minimum: -1
        default: -1
    ThumbnailHeight:
      name: h
      in: query
      required: false
      schema:
        type: integer
        minimum: -1
        default: -1
    ThumbnailCropMode:
      name: c
      in: query
      required: false
      schema:
       $ref: '#/components/schemas/ThumbnailCropMode'
    UserId:
      name: user-id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
    FilteredDownloadToken:
      name: download-token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FilteredDownloadToken'
    PageNum:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    FilterJobType:
      name: type
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/JobType'
    FilterJobStatus:
      name: status
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/JobStatus'
    FilenameFormat:
      name: filename_format
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FilenameFormat'
  responses:
    PingResponse:
      description: "The server is alive"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pong'
    SystemCapabilitiesResponse:
      description: "The system's capabilities, such as supported transcoding qualities."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemCapabilities'
    ProjectMediaArchiveDownloadResponse:
      description: "Project media, archived as a zip or tar file. If mime type is application/octet-stream, the zip file is served."
      content:
        application/octet-stream:
          schema:
            $ref: '#/components/schemas/DownloadFile'
        application/x-tar:
          schema:
            $ref: '#/components/schemas/DownloadFile'
        application/gzip:
          schema:
            $ref: '#/components/schemas/DownloadFile'
        application/zip:
          schema:
            $ref: '#/components/schemas/DownloadFile'
    ProjectMediaDownloadResponse:
      description: "A single media file"
      content:
        application/octet-stream:
          schema:
            $ref: '#/components/schemas/DownloadFile'
    ThumbnailResponse:
      description: "A media's thumbnail."
      content:
        image/jpeg:
          schema:
            $ref: '#/components/schemas/DownloadFile'
    ProjectResponse:
      description: "A single project"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    UserResponse:
      description: "A single user"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    FilteredDownloadResponse:
      description: "A single filtered download"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FilteredDownload'
    PagedProjectsResponse:
      description: "A page of projects"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedProjects'
    PagedUsersResponse:
      description: "A page of users for a project"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedUsers'
    PagedJobsResponse:
      description: "A page of jobs"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedJobs'
    PagedMediaMetadataResponse:
      description: "A page of media metadata"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedMediaMetadata'
    MediaMetadataResponse:
      description: "Media metadata"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaMetadata'
    NotFound:
      description: "The requested object was not found"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: "The request was malformed or invalid"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    DownloadNotAllowed:
      description: "The admin has not yet enabled downloads for this project."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UploadNotAllowed:
      description: "The admin has not yet enabled uploads for this project."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: "An internal server error occurred"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Pong:
      type: object
      required: [message]
      properties:
        message:
          type: string
          enum: ["pong"]
    SystemCapabilities:
      type: object
      required: [supported_transcoding_presets, ffmpeg_path, ffmpeg_version]
      properties:
        supported_transcoding_presets:
          type: array
          items:
            $ref: '#/components/schemas/TranscodePreset'
        ffmpeg_path:
          type: string
        ffmpeg_version:
          type: string
          description: 'The ffmpeg version, as reported by ffmpeg -version'
    Project:
      type: object
      required: [id, share_token, description, share_token_permissions, start, end, expires_at, updated_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
        share_token:
          $ref: '#/components/schemas/Token'
        admin_token:
          $ref: '#/components/schemas/Token'
        description:
          $ref: '#/components/schemas/ProjectDescription'
        share_token_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectShareTokenPermission'
        start:
          $ref: '#/components/schemas/ProjectStart'
        end:
          $ref: '#/components/schemas/ProjectEnd'
        expires_at:
          $ref: '#/components/schemas/ProjectExpiry'
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, name, updated_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        name:
          $ref: '#/components/schemas/Username'
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Job:
      type: object
      required: [id, type, status, description, updated_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        description:
          type: string
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      additionalProperties: true
    ProjectId:
      type: string
      format: uuid
    MediaId:
      type: string
      format: uuid
    UserId:
      type: string
      format: uuid
    JobId:
      type: string
      format: uuid
    FilteredDownloadToken:
      $ref: '#/components/schemas/Token'
    Token:
      type: string
      pattern: "^[abcdefgijkmnopqrstwxyzABCDEFGHJKLMNPQRSTWXYZ23456789]{16}$"
    ProblemDetails:
      # https://www.rfc-editor.org/info/rfc9457/
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
          description: A URI reference that identifies the problem type. When omitted, it is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem.
      additionalProperties: true
      minProperties: 1
    Page:
      type: object
      required: [page_num, per_page, total]
      properties:
        page_num:
          minimum: 1
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        total:
          type: integer
          minimum: 0
          maximum: 100
    NewProject:
      type: object
      required: [description]
      properties:
        description:
          $ref: '#/components/schemas/ProjectDescription'
        start:
          $ref: '#/components/schemas/ProjectStart'
        end:
          $ref: '#/components/schemas/ProjectEnd'
        expires_at:
          $ref: '#/components/schemas/ProjectExpiry'
        share_token_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectShareTokenPermission'
    ProjectUpdate:
      type: object
      properties:
        description:
          $ref: '#/components/schemas/ProjectDescription'
        start:
          $ref: '#/components/schemas/ProjectStart'
        end:
          $ref: '#/components/schemas/ProjectEnd'
        expires_at:
          $ref: '#/components/schemas/ProjectExpiry'
        share_token_permissions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectShareTokenPermission'
      minProperties: 1
    MediaBatchDeletionRequest:
      type: object
      properties:
        media_ids:
          type: array
          items:
            $ref: '#/components/schemas/MediaId'
    PagedProjects:
      type: object
      required: [projects, page]
      properties:
        page:
          $ref: '#/components/schemas/Page'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PagedMediaMetadata:
      type: object
      required: [media_metadata, page]
      properties:
        page:
          $ref: '#/components/schemas/Page'
        media_metadata:
          type: array
          items:
            $ref: '#/components/schemas/MediaMetadata'
    PagedUsers:
      type: object
      required: [users, page]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/Page'
    PagedJobs:
      type: object
      required: [jobs, page]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        page:
          $ref: '#/components/schemas/Page'
    NewUser:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Username'
    ImageMetadata:
      type: object
      required: [id, type, original_filename, generated_filename, width, height, image_codec, original_capture_time, time_correction_offset]
      properties:
        id:
          $ref: '#/components/schemas/MediaId'
        type:
          type: string
          enum: [image]
        original_filename:
          type: string
        generated_filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        image_codec:
          type: string
        original_capture_time:
          type: string
          format: date-time
        time_correction_offset:
          type: string
          format: duration
    VideoMetadata:
      type: object
      required: [id, type, original_filename, generated_filename, width, height, length, video_codec, original_capture_time, time_correction_offset]
      properties:
        id:
          $ref: '#/components/schemas/MediaId'
        type:
          type: string
          enum: [video]
        original_filename:
          type: string
        generated_filename:
          type: string
        width:
          type: integer
        height:
          type: integer
        length:
          type: string
          format: duration
        video_codec:
          type: string
        original_capture_time:
          type: string
          format: date-time
        time_correction_offset:
          type: string
          format: duration
    MediaMetadata:
      oneOf:
        - $ref: '#/components/schemas/ImageMetadata'
        - $ref: '#/components/schemas/VideoMetadata'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageMetadata'
          video: '#/components/schemas/VideoMetadata'
    MediaMetadataUpdate:
      type: object
      properties:
        original_filename:
          type: string
        time_correction_offset:
          type: string
          format: duration
      minProperties: 1
    MediaMetadataTimesync:
      type: object
      required: [media_ids_to_sync]
      properties:
        media_ids_to_sync:
          type: array
          items:
            $ref: '#/components/schemas/MediaId'
    UserUpdate:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Username'
      minProperties: 1
    NewFilteredDownload:
      type: object
      required: [included_media_ids, excluded_media_ids, included_user_ids, excluded_user_ids]
      properties:
        included_media_ids:
          type: array
          items:
            $ref: '#/components/schemas/MediaId'
        excluded_media_ids:
          type: array
          items:
            $ref: '#/components/schemas/MediaId'
        included_user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        excluded_user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        capture_time_start:
          $ref: '#/components/schemas/CaptureRangeStartInclusive'
        capture_time_end:
          $ref: '#/components/schemas/CaptureRangeEndExclusive'
        expires_at:
          $ref: '#/components/schemas/FilteredDownloadExpiry'
          description: "If no value is given, this is set automatically by the server to a reasonable time."
    FilteredDownload:
      type: object
      required: [download_token, included_media_ids, excluded_media_ids, included_user_ids, excluded_user_ids, capture_time_start, capture_time_end, expires_at]
      properties:
        download_token:
          $ref: '#/components/schemas/FilteredDownloadToken'
        included_media_ids:
          type: array
          items:
            $ref: '#/components/schemas/MediaId'
        excluded_media_ids:
          type: array
          items:
            $ref: '#/components/schemas/MediaId'
        included_user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        excluded_user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        capture_time_start:
          oneOf:
            - $ref: '#/components/schemas/CaptureRangeStartInclusive'
            - type: "null"
        capture_time_end:
          oneOf:
            - $ref: '#/components/schemas/CaptureRangeEndExclusive'
            - type: "null"
        expires_at:
          $ref: '#/components/schemas/FilteredDownloadExpiry'
    FilenameFormat:
      type: string
      description: "A time format that follows the go Time.Format specification. See https://pkg.go.dev/time#Layout"
    ProjectDescription:
      type: string
      maxLength: 64
    ProjectStart:
      type: string
      format: date-time
      description: 'The start date and time of the project (event). Used for finding media that does not fall into the project time range.'
    ProjectEnd:
      type: string
      format: date-time
      description: 'The end date and time of the project (event). Used for finding media that does not fall into the project time range.'
    ProjectExpiry:
      type: string
      format: date-time
      description: 'Expiry date for the project. After that time, the project is automatically deleted.'
    CaptureRangeStartInclusive:
      type: string
      format: date-time
      description: 'Exclude media that has a capture time (with correction offset) before this time.'
    CaptureRangeEndExclusive:
      type: string
      format: date-time
      description: 'Exclude media that has a capture time (with correction offset) at or after this time.'
    FilteredDownloadExpiry:
      type: string
      format: date-time
      description: 'The time at or after the prepared download link will automatically be deleted. Does not influence any media deletions.'
    ProjectShareTokenPermission:
      type: string
      description: 'The actions allowed to perform via the share token.'
      enum:
        - upload
        - download
    Username:
      type: string
      description: "A user's name"
      pattern: "^[a-zA-Z0-9\\s_-]{1,32}$"
    TranscodePreset:
      type: string
      enum:
        - "h264-2160p"
        - "h264-1440p"
        - "h264-1080p"
        - "h264-720p"
        - "h264-480p"
        - "h265-2160p"
        - "h265-1440p"
        - "h265-1080p"
        - "h265-720p"
        - "h265-480p"
    JobType:
      type: string
      description: "A job's type"
      enum:
        - transcode
        - thumbnail
    JobStatus:
      type: string
      description: "A job's status"
      enum:
        - created
        - running
        - success
        - failed
    DownloadFile:
      type: string
      format: binary
    ThumbnailCropMode:
      type: string
      enum:
        - center
        - stretch
        - box
      description: |
        Crop mode:
        - `center`: Image dimensions are kept and the image is scaled to fit the given width and height. No black bars are present.
        - `stretch`: Image dimensions are *not* kept and the image is scaled and stretched to fit the given width and height. No black bars are present.
        - `box`: Image dimensions are kept and the image is scaled to fit inside the given width and height. Black bars (pillorboxing/letterboxing) might occur.
      default: center
